vehicle_approach_node:
  ros__parameters:
    # rqt_image_view 사용 시 별도 OpenCV 창은 꺼서 CPU 사용량을 줄인다.
    debug_view: false
    # RGB 화면/annotated 토픽은 YOLO+Depth 동기화와 분리되어 OAK-D 입력 FPS로 갱신된다.
    publish_annotated_image: true
    display_rate_hz: 30.0
    annotated_image_topic: "/vehicle_approach/annotated_image"
    yolo_weights_path: "~/b3_int1_mini/best.pt"
    vehicle_class_id: 0
    confidence_threshold: 0.75

    # 업로드본에서 사용하던 OAK-D 토픽을 유지했다.
    rgb_topic: "/robot11/oakd/rgb/image_raw"
    depth_topic: "/robot11/oakd/stereo/image_raw"
    # 현재 실제 발행이 확인된 compressedDepth 토픽을 사용한다.
    use_compressed_depth: true
    depth_compressed_topic: "/robot11/oakd/stereo/image_raw/compressedDepth"
    camera_info_topic: "/robot11/oakd/rgb/camera_info"
    camera_frame: "oakd_rgb_camera_optical_frame"
    base_frame: "base_link"
    nav_action_name: "/robot11/navigate_to_pose"
    sync_queue_size: 10
    sync_slop_s: 0.15

    # OAK-D 정밀 추종
    moving_average_window: 3
    goal_resend_threshold_m: 0.20
    goal_update_rate_hz: 2.0
    desired_follow_distance_m: 0.70
    distance_deadband_m: 0.08
    target_timeout_s: 0.80

    bbox_inner_ratio: 0.60
    target_min_depth_m: 0.20
    target_max_depth_m: 4.00
    apply_depth_correction: true

    # 초기 접근에만 사용하는 외부 웹캠 가이드.
    # OAK-D가 RC카를 한 번 탐지하면 아래 입력은 이후 이동에 사용되지 않는다.
    webcam_visible_topic: "/webcam/vehicle_detected"
    webcam_map_pose_topic: "/webcam/vehicle_map_pose"
    webcam_state_timeout_s: 1.0
    webcam_pose_timeout_s: 0.8
    oakd_loss_before_webcam_guide_s: 0.35
    webcam_guide_standoff_m: 0.90
    webcam_guide_goal_threshold_m: 0.20
    webcam_guide_rate_hz: 1.0

    # OAK-D Depth를 Nav2 동적 장애물로 반영
    publish_obstacle_cloud: true
    obstacle_cloud_topic: "/vehicle_approach/obstacle_points"
    obstacle_cloud_rate_hz: 5.0
    obstacle_cloud_stride: 10
    obstacle_min_depth_m: 0.15
    obstacle_max_depth_m: 3.0
