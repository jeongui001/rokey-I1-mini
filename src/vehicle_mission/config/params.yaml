# Run with: ros2 run vehicle_mission vehicle_mission_node --ros-args --params-file src/vehicle_mission/config/params.yaml
vehicle_mission_node:
  ros__parameters:
    # 대기 지점 = SLAM 시작 지점(undock 직후 map 원점, (0,0,0))으로 확정
    waypoint_x: 0.0    # 맵 상 대기 지점 x(m)
    waypoint_y: 0.0    # 맵 상 대기 지점 y(m)
    waypoint_yaw: 0.0  # 대기 지점에서의 로봇 헤딩(rad)
